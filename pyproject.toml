[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mobile-gui-vla-human-demo-collector"
version = "0.1.0"
description = "Public evaluation preview of the Mobile GUI-VLA human demonstration collector"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["Pillow>=10,<12"]

[project.scripts]
gui-vla-data-lab = "mobile_gui_vla_data_lab.cli:main"
gui-vla-inventory = "mobile_gui_vla_platform.inventory:main"
gui-vla-devices = "mobile_gui_vla_platform.adb:discovery_main"
gui-vla-adb-smoke = "mobile_gui_vla_platform.smoke:main"

[tool.setuptools.packages.find]
where = ["src"]
